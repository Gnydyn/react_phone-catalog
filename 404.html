<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var l = window.location;
        var repo = "/react_phone-catalog";
        var path = l.pathname.startsWith(repo)
          ? l.pathname.slice(repo.length)
          : l.pathname;
        var search = l.search ? "&" + l.search.slice(1) : "";
        var redirect = repo + "/?/" + path.replace(/&/g, "~and~") + search + l.hash;
        l.replace(l.origin + redirect);
      })();
    </script>
  </head>
  <body></body>
</html>
